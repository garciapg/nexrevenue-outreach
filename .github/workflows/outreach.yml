name: outreach

# Times are UTC. ET = UTC-5 in winter (UTC-4 in summer), so these run about an hour later in summer.
on:
  schedule:
    - cron: "0 11 * * 1-5"      # intake  ~6:00am ET weekdays
    - cron: "30 11 * * 1-5"     # write   ~6:30am ET weekdays
    - cron: "0 12 * * 1-5"      # draft   ~7:00am ET weekdays
    - cron: "15,45 12-23 * * *" # watch   every 30 min ~7am-7pm ET
    - cron: "0 23 * * *"        # report  ~6:00pm ET daily
  workflow_dispatch:
    inputs:
      job:
        description: "Job or block(s): intake, write, draft, watch, report, or e.g. 'qualify personalize'"
        required: true
        default: watch
      dry_run:
        description: "Dry run (write nothing, create no drafts)"
        type: boolean
        default: false

concurrency:
  group: outreach
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install Claude Code (model calls use your subscription token)
        run: npm install -g @anthropic-ai/claude-code
      - name: Pick job
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "0 11 * * 1-5") JOB=intake ;;
            "30 11 * * 1-5") JOB=write ;;
            "0 12 * * 1-5") JOB=draft ;;
            "15,45 12-23 * * *") JOB=watch ;;
            "0 23 * * *") JOB=report ;;
            *) JOB="${{ github.event.inputs.job }}" ;;
          esac
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          BUSINESS_ADDRESS: ${{ secrets.BUSINESS_ADDRESS }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MILLIONVERIFIER_KEY: ${{ secrets.MILLIONVERIFIER_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python -m outreach run ${{ steps.pick.outputs.job }}
